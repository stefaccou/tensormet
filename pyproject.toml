[project]
name = "tensormet"        # project name
version = "0.3.0"
description = """
Project utilities for tensor repo.
"""
requires-python = ">=3.9"
dependencies = [
    "beautifulsoup4",  # experimental/parse_master_metaphor_list.py scrapes the MML index
    "cupy",
    "datasets",
    "matplotlib",
    "numpy",
    "nvidia-ml-py",
    "pyTensorlab",
    "requests",
    "scipy",
    "sparse",
    "submitit",  # Slurm dispatch for Tier-2 HPC jobs (tensormet.experimental.submit)
    "tensorly",
    "threadpoolctl",
    "torch",
    "tqdm",
    # judge.py loads the judge with dtype=torch.float16. That kwarg was named
    # torch_dtype until 4.56; older versions swallow `dtype` into the config and
    # silently load fp32, doubling the judge's GPU footprint.
    "transformers>=4.56",
    "pyarrow",
    "spacy" # for vector creation
]

[project.optional-dependencies]
tf = ["tensorflow"]  # only used by the optional TF-sparse branch and experimental/sparse_tf.py
experimental = ["pandas"]  # experimental/inspect_tucker.py

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# We only expose standalone modules here, NOT packages,
# to avoid accidentally packaging `semsimlib_local` etc.
#py-modules = ["utils", "tucker_tensor", "sparse_ops", "similarity", "distance", "config", "routing"]
#packages = []
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["tensormet*"]